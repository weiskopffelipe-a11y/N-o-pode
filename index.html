<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Não Pode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1d22;
    --ink-soft:#26272e;
    --ink-soft-2:#2e2f38;
    --paper:#fbf6ec;
    --paper-text:#211c16;
    --red:#e5352b;
    --red-dark:#b8241c;
    --green:#2fae5d;
    --green-dark:#1f8a47;
    --yellow:#f2b134;
    --yellow-dark:#c98e1d;
    --chalk:#f5f1e6;
    --chalk-dim:#a9a9b4;
    --chalk-dim-2:#77787f;
    --teamA:#ff8a3d;
    --teamB:#2ec4b6;
    --teamC:#8b5cf6;
    --radius-card: 28px;
    --radius-pill: 999px;
    --radius-panel: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:'Baloo 2', system-ui, sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
    overflow-x:hidden;
  }
  #app{ min-height:100vh; display:flex; flex-direction:column; }
  h1,h2,h3{ margin:0; font-weight:800; }
  p{ margin:0; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; -webkit-tap-highlight-color:transparent; }
  input,select,textarea{ font-family:inherit; }
  ul{ list-style:none; margin:0; padding:0; }
  a{ color:inherit; }
  ::selection{ background:var(--yellow); color:var(--ink); }

  .wordmark{
    font-family:'Bungee', system-ui, sans-serif;
    letter-spacing:0.5px;
    color:var(--red);
    text-shadow: 3px 3px 0 rgba(0,0,0,0.35);
    line-height:1;
  }

  .no-symbol{
    display:inline-block;
    width:1em; height:1em;
    border-radius:50%;
    background:var(--red);
    position:relative;
    box-shadow: inset 0 0 0 3px var(--chalk);
    flex-shrink:0;
  }
  .no-symbol::after{
    content:"";
    position:absolute;
    left:14%; top:50%;
    width:72%; height:11%;
    background:var(--chalk);
    transform:translateY(-50%) rotate(-45deg);
  }

  /* ---------- generic layout shells ---------- */
  .app-shell{
    flex:1;
    width:100%;
    max-width:560px;
    margin:0 auto;
    padding:calc(24px + var(--safe-top)) 20px calc(28px + var(--safe-bottom));
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .app-shell.wide{ max-width:1080px; }

  .topbar{
    display:flex; align-items:center; gap:12px; margin-bottom:4px;
  }
  .back-btn{
    width:40px; height:40px; border-radius:50%;
    background:var(--ink-soft); color:var(--chalk);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0;
  }
  .back-btn:active{ background:var(--ink-soft-2); }
  .topbar-title{ font-size:20px; font-weight:700; }

  /* ---------- buttons ---------- */
  .btn{
    border-radius:var(--radius-pill);
    padding:16px 22px;
    font-weight:700;
    font-size:17px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .08s ease, filter .12s ease;
    width:100%;
  }
  .btn:active{ transform:scale(0.97); }
  .btn:disabled{ opacity:.4; pointer-events:none; }
  .btn-primary{ background:var(--red); color:var(--chalk); box-shadow:0 6px 0 var(--red-dark); }
  .btn-primary:active{ box-shadow:0 2px 0 var(--red-dark); transform:translateY(4px) scale(0.99); }
  .btn-green{ background:var(--green); color:#0e2a17; box-shadow:0 6px 0 var(--green-dark); }
  .btn-green:active{ box-shadow:0 2px 0 var(--green-dark); transform:translateY(4px) scale(0.99); }
  .btn-yellow{ background:var(--yellow); color:#3a2705; box-shadow:0 6px 0 var(--yellow-dark); }
  .btn-yellow:active{ box-shadow:0 2px 0 var(--yellow-dark); transform:translateY(4px) scale(0.99); }
  .btn-outline{ background:transparent; color:var(--chalk); box-shadow:inset 0 0 0 2px var(--ink-soft-2); }
  .btn-outline:active{ background:var(--ink-soft); }
  .btn-ghost{ background:transparent; color:var(--chalk-dim); font-weight:600; padding:10px; }
  .btn-sm{ padding:10px 16px; font-size:14px; width:auto; }
  .btn-icon{ width:46px; padding:0; flex-shrink:0; }

  /* ---------- home ---------- */
  .home-screen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; text-align:center; }
  .home-logo-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .home-logo{ font-size:52px; display:flex; align-items:center; gap:12px; }
  .home-tagline{ color:var(--chalk-dim); font-size:16px; max-width:320px; line-height:1.5; font-weight:500; }
  .home-actions{ width:100%; max-width:320px; display:flex; flex-direction:column; gap:14px; }

  /* ---------- panels / forms ---------- */
  .panel{ background:var(--ink-soft); border-radius:var(--radius-panel); padding:18px; }
  .field{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ font-size:13px; font-weight:700; color:var(--chalk-dim); }
  .field input[type=text], .field input[type=number]{
    background:var(--ink); border:2px solid var(--ink-soft-2); border-radius:14px;
    padding:14px 16px; color:var(--chalk); font-size:16px; font-weight:600; width:100%;
  }
  .field input:focus{ outline:none; border-color:var(--yellow); }
  .field-hint{ font-size:12px; color:var(--chalk-dim-2); }
  .section-title{ font-size:15px; font-weight:700; color:var(--chalk-dim); margin:2px 0 -4px; }

  .chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:9px 14px; border-radius:var(--radius-pill); font-size:13px; font-weight:700;
    background:var(--ink); box-shadow:inset 0 0 0 2px var(--ink-soft-2); color:var(--chalk-dim);
  }
  .chip.active{ background:var(--yellow); color:#3a2705; box-shadow:none; }

  .segmented{ display:flex; background:var(--ink); border-radius:14px; padding:4px; gap:4px; }
  .segmented button{ flex:1; padding:11px 6px; border-radius:10px; font-weight:700; font-size:13px; color:var(--chalk-dim); text-align:center; }
  .segmented button.active{ background:var(--red); color:var(--chalk); }

  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{ width:42px; height:42px; border-radius:50%; background:var(--ink); box-shadow:inset 0 0 0 2px var(--ink-soft-2); font-size:20px; font-weight:800; flex-shrink:0; }
  .stepper .val{ flex:1; text-align:center; font-size:22px; font-weight:800; }

  .error-msg{ background:rgba(229,53,43,0.15); border:2px solid var(--red); color:#ff9d97; padding:12px 14px; border-radius:14px; font-size:14px; font-weight:600; }
  .toast{
    position:fixed; bottom:calc(24px + var(--safe-bottom)); left:50%; transform:translateX(-50%);
    background:var(--chalk); color:var(--paper-text); padding:12px 20px; border-radius:var(--radius-pill);
    font-weight:700; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.35); z-index:999;
    animation: toastIn .2s ease;
  }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(-50%) translateY(10px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }

  /* ---------- lobby ---------- */
  .code-banner{
    background:var(--ink-soft); border-radius:var(--radius-panel); padding:18px; text-align:center;
  }
  .code-banner .room-name{ font-size:14px; color:var(--chalk-dim); font-weight:700; margin-bottom:6px; }
  .code-value{ font-family:'Bungee', system-ui; font-size:34px; letter-spacing:6px; color:var(--yellow); }
  .code-actions{ display:flex; gap:10px; margin-top:14px; }

  .team-column{ background:var(--ink-soft); border-radius:var(--radius-panel); padding:14px; flex:1; min-width:0; }
  .team-header{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; margin-bottom:10px; }
  .team-dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .teams-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .player-row{
    display:flex; align-items:center; gap:10px; padding:9px 4px; font-size:14px; font-weight:600;
  }
  .player-dot{ width:8px; height:8px; border-radius:50%; background:var(--chalk-dim-2); flex-shrink:0; }
  .player-dot.online{ background:var(--green); }
  .player-you-tag{ font-size:10px; background:var(--ink); padding:2px 7px; border-radius:var(--radius-pill); color:var(--chalk-dim); }
  .team-switch{ margin-left:auto; font-size:11px; color:var(--chalk-dim-2); font-weight:700; }

  /* ---------- round: stage ---------- */
  .stage{
    flex:1; display:flex; flex-direction:column; min-height:100vh;
    padding: calc(16px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
    gap:14px;
  }
  .stage-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .turn-pill{
    background:var(--ink-soft); padding:9px 16px; border-radius:var(--radius-pill);
    font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px;
  }
  .score-pill{ background:var(--ink-soft); padding:9px 16px; border-radius:var(--radius-pill); font-size:13px; font-weight:800; }

  .stage-main{ flex:1; display:flex; flex-direction:column; gap:16px; min-height:0; }

  .taboo-card{
    background:var(--paper); color:var(--paper-text); border-radius:var(--radius-card);
    padding:26px 22px 30px; flex:1; display:flex; flex-direction:column;
    box-shadow:0 14px 0 rgba(0,0,0,0.35);
    position:relative; overflow:hidden; min-height:0;
  }
  .taboo-alert{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-weight:800; font-size:14px; letter-spacing:1px; color:var(--red-dark);
    margin-bottom:14px;
  }
  .taboo-alert .no-symbol{ font-size:16px; }
  .taboo-word-wrap{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; padding:10px 4px 20px; }
  .taboo-word{
    font-size:clamp(30px, 9vw, 52px); font-weight:800; text-align:center; line-height:1.05; word-break:break-word;
  }
  .taboo-sep{ height:3px; background:repeating-linear-gradient(90deg, var(--red) 0 14px, transparent 14px 22px); border-radius:3px; margin-bottom:16px; }
  .taboo-forbidden-title{ font-size:12px; font-weight:800; letter-spacing:1px; color:var(--chalk-dim-2); margin-bottom:10px; text-align:center; }
  .taboo-forbidden-list{ display:flex; flex-direction:column; gap:9px; overflow-y:auto; }
  .taboo-forbidden-list li{
    display:flex; align-items:center; gap:10px; font-size:clamp(16px,5vw,20px); font-weight:700;
    background:rgba(229,53,43,0.08); padding:10px 14px; border-radius:12px;
  }
  .taboo-forbidden-list li .x{ color:var(--red); font-weight:800; }

  .round-controls{ display:grid; grid-template-columns:1fr 1fr; gap:10px; flex-shrink:0; }
  .round-controls .btn-proibida{ grid-column:1 / -1; }
  .control-btn{ padding:18px 10px; font-size:15px; border-radius:20px; font-weight:800; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .control-btn .emoji{ font-size:22px; }

  .waiting-view{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:20px;
  }
  .waiting-mic{ font-size:56px; animation: micPulse 1.6s ease-in-out infinite; }
  @keyframes micPulse{ 0%,100%{ transform:scale(1); opacity:1;} 50%{ transform:scale(1.12); opacity:.75;} }
  .waiting-title{ font-size:22px; font-weight:800; }
  .waiting-sub{ color:var(--chalk-dim); font-size:14px; max-width:280px; }
  .scoreboard{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .score-chip{ background:var(--ink-soft); border-radius:16px; padding:12px 18px; text-align:center; min-width:84px; }
  .score-chip .n{ font-size:24px; font-weight:800; }
  .score-chip .l{ font-size:11px; color:var(--chalk-dim); font-weight:700; }

  .feedback-flash{
    position:fixed; inset:0; z-index:500; pointer-events:none; opacity:0;
  }
  .feedback-flash.show{ animation: flashPop .55s ease; }
  @keyframes flashPop{ 0%{ opacity:0;} 15%{ opacity:1;} 100%{ opacity:0;} }
  .feedback-flash.acerto{ background:radial-gradient(circle, rgba(47,174,93,0.55), transparent 70%); }
  .feedback-flash.proibida{ background:radial-gradient(circle, rgba(229,53,43,0.55), transparent 70%); }
  .feedback-flash.pular{ background:radial-gradient(circle, rgba(242,177,52,0.45), transparent 70%); }
  .feedback-word{
    position:fixed; top:44%; left:50%; transform:translate(-50%,-50%) scale(0.7); z-index:501;
    font-family:'Bungee'; font-size:30px; opacity:0; pointer-events:none; text-align:center;
  }
  .feedback-word.show{ animation: wordPop .55s cubic-bezier(.2,1.4,.4,1); }
  @keyframes wordPop{ 0%{opacity:0; transform:translate(-50%,-50%) scale(0.6);} 30%{opacity:1; transform:translate(-50%,-50%) scale(1.08);} 70%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-50%) scale(1);} }

  /* ---------- ffa picker ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:600; display:flex; align-items:flex-end; justify-content:center; }
  .modal-sheet{ background:var(--ink-soft); width:100%; max-width:560px; border-radius:24px 24px 0 0; padding:22px 20px calc(22px + var(--safe-bottom)); display:flex; flex-direction:column; gap:12px; max-height:80vh; overflow-y:auto; }
  .modal-title{ font-size:18px; font-weight:800; text-align:center; margin-bottom:4px; }
  .picker-btn{ background:var(--ink); border-radius:16px; padding:15px; font-weight:700; font-size:16px; text-align:center; }
  .picker-btn:active{ background:var(--ink-soft-2); }

  /* ---------- pass phone cover ---------- */
  .cover-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    text-align:center; padding:20px;
  }
  .cover-emoji{ font-size:64px; }
  .cover-title{ font-size:24px; font-weight:800; }
  .cover-sub{ color:var(--chalk-dim); font-size:15px; max-width:280px; }

  /* ---------- end screen ---------- */
  .winner-banner{
    background:linear-gradient(160deg, var(--yellow), var(--red)); border-radius:var(--radius-card);
    padding:34px 20px; text-align:center; position:relative; overflow:hidden;
  }
  .winner-trophy{ font-size:46px; margin-bottom:8px; }
  .winner-title{ font-size:26px; font-weight:800; color:#2b1400; }
  .winner-sub{ font-size:15px; color:#2b1400; opacity:.85; font-weight:600; margin-top:4px; }
  .final-scores{ display:flex; gap:10px; flex-wrap:wrap; }
  .final-score-card{ background:var(--ink-soft); border-radius:16px; padding:16px; flex:1; min-width:120px; }
  .final-score-card .n{ font-size:28px; font-weight:800; }
  .word-history{ display:flex; flex-direction:column; gap:12px; }
  .word-history-group h3{ font-size:13px; color:var(--chalk-dim); margin-bottom:8px; }
  .word-tags{ display:flex; flex-wrap:wrap; gap:6px; }
  .word-tag{ background:var(--ink-soft); padding:6px 12px; border-radius:var(--radius-pill); font-size:12px; font-weight:700; }
  .word-tag.acerto{ background:rgba(47,174,93,0.18); color:#7fe3a4; }
  .word-tag.proibida{ background:rgba(229,53,43,0.18); color:#ff9d97; }
  .word-tag.pulou{ background:rgba(242,177,52,0.18); color:#ffd685; }
  .end-actions{ display:flex; gap:10px; }

  /* ---------- how to play ---------- */
  .howto-item{ display:flex; gap:14px; align-items:flex-start; }
  .howto-emoji{ font-size:26px; flex-shrink:0; width:34px; text-align:center; }
  .howto-text h3{ font-size:15px; margin-bottom:3px; }
  .howto-text p{ font-size:14px; color:var(--chalk-dim); line-height:1.5; }

  /* ---------- desktop enhancements ---------- */
  .desktop-grid{ display:block; }
  .desktop-panel{ display:none; }

  @media (min-width: 900px){
    .app-shell{ padding-top:56px; }
    .home-logo{ font-size:68px; }

    .stage{ padding:32px 40px; }
    .desktop-grid{
      display:grid; grid-template-columns: 260px minmax(340px,560px) 260px;
      gap:24px; flex:1; align-items:start; max-width:1200px; margin:0 auto; width:100%;
    }
    .desktop-panel{ display:flex; flex-direction:column; gap:14px; background:var(--ink-soft); border-radius:var(--radius-panel); padding:18px; }
    .desktop-panel h3{ font-size:13px; color:var(--chalk-dim); letter-spacing:.3px; }
    .stage-main{ max-width:560px; margin:0 auto; width:100%; }
    .taboo-word{ font-size:clamp(38px, 4vw, 58px); }
    .history-mini{ display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; }
    .history-mini-row{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
</style>
</head>

const CATEGORIES = ["Animais","Comidas","Bebidas","Objetos","Lugares","Países","Cidades","Profissões","Esportes","Filmes","Séries","Personagens","Jogos","Tecnologia","Internet","Música","Celebridades","Natureza","Corpo humano","Escola","Casa","Transporte","Viagens","Cultura geral","Ciência","História","Super-heróis","Fantasia","Dia a dia","Palavras engraçadas","Palavras difíceis"];

const CONTENT_MODES = {
  normal:  { label:'Normal',  emoji:'🎲', categoria:null,           desc:'Todas as categorias, para todas as idades.' },
  adulto:  { label:'+18',     emoji:'🔥', categoria:'Adulto (+18)', desc:'Bebida, paquera, relacionamento e palavrão sem filtro. Só para maiores de 18.' },
  futebol: { label:'Futebol', emoji:'⚽', categoria:'Futebol',      desc:'Craques, times e tudo mais do mundo da bola.' },
};
const TEAM_INFO = {
  A: { label:'Time A', dot:'var(--teamA)', emoji:'🟠' },
  B: { label:'Time B', dot:'var(--teamB)', emoji:'🔵' },
  C: { label:'Time C', dot:'var(--teamC)', emoji:'🟣' },
};
const WIN_OPTIONS = [10,20,30];
const POLL_MS = 1800;
const PRESENCE_MS = 17000;
const ONLINE_WINDOW_MS = 40000;

// ---------- utilidades ----------
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function roomCodeGen(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sem 0/O/1/I/L para evitar confusão
  let s = '';
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function stripAccents(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function normalizeWord(s){ return stripAccents(String(s||'').toLowerCase().trim()); }
function esc(s){
  const d = document.createElement('div');
  d.textContent = (s===null || s===undefined) ? '' : String(s);
  return d.innerHTML;
}
function clampNum(n,min,max){ return Math.max(min,Math.min(max,n)); }
function timeAgoOnline(lastSeen){ return (Date.now() - (lastSeen||0)) < ONLINE_WINDOW_MS; }

// ---------- armazenamento (sala compartilhada) ----------
async function loadRoom(code){
  try{
    const res = await window.storage.get('room:'+code, true);
    if(!res || res.value===undefined || res.value===null) return null;
    return JSON.parse(res.value);
  }catch(e){ return null; }
}
async function saveRoom(code, room){
  try{
    const res = await window.storage.set('room:'+code, JSON.stringify(room), true);
    return !!res;
  }catch(e){ return false; }
}

  }

// ---------- times / rotação ----------
function teamsList(teamMode){ return teamMode==='3teams' ? ['A','B','C'] : ['A','B']; }
function isFfa(teamMode){ return teamMode==='ffa'; }
function playersOfTeam(players, team){
  return Object.values(players).filter(p=>p.team===team);
}
function autoAssignTeam(room){
  if(isFfa(room.meta.teamMode)) return null;
  const list = teamsList(room.meta.teamMode);
  const counts = {}; list.forEach(t=>counts[t]=0);
  Object.values(room.players).forEach(p=>{ if(p.team && counts[p.team]!==undefined) counts[p.team]++; });
  return list.reduce((a,b)=> counts[a]<=counts[b] ? a : b);
}
function shuffleTeams(room){
  if(isFfa(room.meta.teamMode)) return;
  const ids = shuffle(Object.keys(room.players));
  const list = teamsList(room.meta.teamMode);
  ids.forEach((id,i)=>{ room.players[id].team = list[i % list.length]; });
}
function cycleTeamFor(room, playerId){
  if(isFfa(room.meta.teamMode)) return;
  const list = teamsList(room.meta.teamMode);
  const p = room.players[playerId];
  if(!p) return;
  const i = list.indexOf(p.team);
  p.team = list[(i+1) % list.length];
}

// ---------- baralho ----------
function buildDeckIndices(contentMode, categories, difficulties){
  const diffs = (difficulties && difficulties.length) ? difficulties : DIFFICULTIES;
  const special = contentMode && CONTENT_MODES[contentMode] ? CONTENT_MODES[contentMode].categoria : null;
  const cats = (categories && categories.length) ? categories : CATEGORIES;
  const idxs = [];
  for(let i=0;i<WORD_BANK.length;i++){
    const c = WORD_BANK[i];
    if(diffs.indexOf(c.dificuldade)===-1) continue;
    if(special){ if(c.categoria===special) idxs.push(i); }
    else { if(cats.indexOf(c.categoria)!==-1) idxs.push(i); }
  }
  return shuffle(idxs);
}
function drawCard(g){
  if(!g.deck || g.deckPos >= g.deck.length){
    g.deck = buildDeckIndices(g.contentMode, g.categories, g.difficulties);
    g.deckPos = 0;
  }
  if(!g.deck.length) return null;
  const idx = g.deck[g.deckPos];
  g.deckPos++;
  g.currentCardIndex = idx;
  return WORD_BANK[idx];
}
function currentCard(g){
  if(g && g.currentCardIndex!=null && WORD_BANK[g.currentCardIndex]) return WORD_BANK[g.currentCardIndex];
  return null;
}

// ---------- início / condução de jogo ----------
function initGame(room){
  const g = {};
  g.status = 'playing';
  g.contentMode = room.meta.contentMode || 'normal';
  g.categories = room.meta.categories;
  g.difficulties = room.meta.difficulties;
  g.teamMode = room.meta.teamMode;
  g.winCondition = room.meta.winCondition;
  g.history = [];
  g.deck = buildDeckIndices(g.contentMode, g.categories, g.difficulties);
  g.deckPos = 0;
  g.winnerKey = null;
  if(isFfa(g.teamMode)){
    g.turnOrder = shuffle(Object.keys(room.players));
    g.turnIndex = 0;
    g.scores = {};
    Object.keys(room.players).forEach(pid=>{ g.scores[pid]=0; });
  } else {
    const list = teamsList(g.teamMode);
    g.currentTeam = list[0];
    g.teamPointers = {}; list.forEach(t=>{ g.teamPointers[t]=0; });
    g.scores = {}; list.forEach(t=>{ g.scores[t]=0; });
  }
  drawCard(g);
  room.game = g;
}
function getClueGiverId(room){
  const g = room.game;
  if(!g) return null;
  if(isFfa(g.teamMode)){
    if(!g.turnOrder || !g.turnOrder.length) return null;
    return g.turnOrder[g.turnIndex % g.turnOrder.length];
  }
  const team = playersOfTeam(room.players, g.currentTeam);
  if(!team.length) return null;
  team.sort((a,b)=> (a.joinedAt||0)-(b.joinedAt||0)); // ordem estável
  return team[g.teamPointers[g.currentTeam] % team.length].id;
}
function checkWin(room){
  const g = room.game;
  const entries = Object.entries(g.scores);
  for(let i=0;i<entries.length;i++){
    if(entries[i][1] >= g.winCondition){ g.status='ended'; g.winnerKey=entries[i][0]; return; }
  }
}
function pushHistory(g, card, resultado, quem){
  g.history.push({ palavra:card.palavra, categoria:card.categoria, resultado, quem });
}
// Uma palavra por vez: depois de CADA carta (acertou, pulou ou proibida),
// a vez sempre passa para o próximo time (ou próxima pessoa, no modo todos-contra-todos).
function advanceTurn(room){
  const g = room.game;
  if(isFfa(g.teamMode)){
    g.turnIndex = (g.turnIndex+1) % (g.turnOrder.length||1);
  } else {
    const list = teamsList(g.teamMode);
    const tp = playersOfTeam(room.players, g.currentTeam);
    if(tp.length) g.teamPointers[g.currentTeam] = (g.teamPointers[g.currentTeam]+1) % tp.length;
    const i = list.indexOf(g.currentTeam);
    g.currentTeam = list[(i+1)%list.length];
  }
}
function actionAcertou(room, ffaGuesserId){
  const g = room.game;
  const card = currentCard(g);
  if(!card) return;
  if(isFfa(g.teamMode)){
    const target = ffaGuesserId || getClueGiverId(room);
    g.scores[target] = (g.scores[target]||0) + 1;
    pushHistory(g, card, 'acerto', target);
  } else {
    g.scores[g.currentTeam]++;
    pushHistory(g, card, 'acerto', g.currentTeam);
  }
  advanceTurn(room);
  checkWin(room);
  if(g.status==='playing') drawCard(g);
  if(ST.mode==='local' && g.status==='playing') ST.localCoverActive = true;
}
function actionPulou(room){
  const g = room.game;
  const card = currentCard(g);
  if(!card) return;
  const quem = isFfa(g.teamMode) ? getClueGiverId(room) : g.currentTeam;
  pushHistory(g, card, 'pulou', quem);
  advanceTurn(room);
  drawCard(g);
  if(ST.mode==='local') ST.localCoverActive = true;
}
function actionProibida(room){
  const g = room.game;
  const card = currentCard(g);
  if(!card) return;
  if(isFfa(g.teamMode)){
    const cg = getClueGiverId(room);
    g.scores[cg] = (g.scores[cg]||0) - 1;
    pushHistory(g, card, 'proibida', cg);
  } else {
    g.scores[g.currentTeam]--;
    pushHistory(g, card, 'proibida', g.currentTeam);
  }
  advanceTurn(room);
  checkWin(room);
  if(g.status==='playing') drawCard(g);
  if(ST.mode==='local' && g.status==='playing') ST.localCoverActive = true;
}

// ---------- toast / erros ----------
function showToast(msg){
  ST.toastMsg = msg;
  clearTimeout(ST.toastTimer);
  render();
  ST.toastTimer = setTimeout(()=>{ ST.toastMsg=''; render(); }, 2200);
}

// ---------- polling / presença (modo online) ----------
function stopPolling(){
  if(ST.pollTimer){ clearInterval(ST.pollTimer); ST.pollTimer=null; }
  if(ST.presenceTimer){ clearInterval(ST.presenceTimer); ST.presenceTimer=null; }
}
function startPolling(code){
  stopPolling();
  ST.pollTimer = setInterval(async ()=>{
    const r = await loadRoom(code);
    if(r){ ST.room = r; render(); }
  }, POLL_MS);
  ST.presenceTimer = setInterval(async ()=>{
    const r = await loadRoom(code);
    if(r && r.players[ST.me.id]){
      r.players[ST.me.id].lastSeen = Date.now();
      ST.room = r;
      await saveRoom(code, r);
    }
  }, PRESENCE_MS + Math.floor(Math.random()*2500));
}

// ---------- criar / entrar / sair de sala ----------
async function createRoom(){
  const f = ST.form;
  ST.err.create = '';
  if(f.mode==='local'){
    const names = f.localPlayers.filter(n=>n.trim());
    const minNeeded = f.teamMode==='ffa' ? 2 : (f.teamMode==='3teams' ? 3 : 2);
    if(names.length < minNeeded){ ST.err.create = `Adicione pelo menos ${minNeeded} jogadores.`; render(); return; }
    const players = {};
    names.forEach((n,i)=>{
      const id = 'local'+i+'_'+uid();
      players[id] = { id, name:n.trim(), team:null, isHost:i===0, joinedAt:i, lastSeen:Date.now() };
    });
    if(f.teamMode!=='ffa'){
      const ids = shuffle(Object.keys(players));
      const list = teamsList(f.teamMode);
      ids.forEach((id,i)=>{ players[id].team = list[i%list.length]; });
    }
    const room = {
      meta:{
        code:null, name:f.roomName.trim() || 'Jogo local', hostId:Object.keys(players)[0],
        maxPlayers: names.length, contentMode:f.contentMode, categories:f.categories.slice(), difficulties:f.difficulties.slice(),
        teamMode:f.teamMode, winCondition: f.winCustomMode ? (parseInt(f.winCustom,10)||15) : f.winCondition,
        localPassMode:true, createdAt:Date.now(),
      },
      players, game:null,
    };
    ST.mode = 'local';
    ST.localRoom = room;
    ST.screen = 'lobby';
    render();
    return;
  }
  // modo online
  if(!f.hostName.trim()){ ST.err.create = 'Digite seu nome.'; render(); return; }
  ST.busy = true; render();
  const code = roomCodeGen();
  const room = {
    meta:{
      code, name:f.roomName.trim() || 'Sala sem nome', hostId:ST.me.id,
      maxPlayers: clampNum(f.maxPlayers,2,24), contentMode:f.contentMode, categories:f.categories.slice(), difficulties:f.difficulties.slice(),
      teamMode:f.teamMode, winCondition: f.winCustomMode ? (parseInt(f.winCustom,10)||15) : f.winCondition,
      localPassMode:false, createdAt:Date.now(),
    },
    players:{
      [ST.me.id]: { id:ST.me.id, name:f.hostName.trim(), team:null, isHost:true, joinedAt:Date.now(), lastSeen:Date.now() }
    },
    game:null,
  };
  room.players[ST.me.id].team = autoAssignTeam(room);
  ST.me.name = f.hostName.trim();
  ST.mode = 'online';
  ST.roomCode = code;
  const ok = await saveRoom(code, room);
  ST.busy = false;
  if(!ok){ ST.err.create = 'Não foi possível criar a sala. Tente novamente.'; render(); return; }
  ST.room = room;
  ST.screen = 'lobby';
  startPolling(code);
  render();
}

async function joinRoom(){
  const j = ST.join;
  ST.err.join = '';
  const code = j.code.trim().toUpperCase();
  if(!code){ ST.err.join = 'Digite o código da sala.'; render(); return; }
  if(!j.name.trim()){ ST.err.join = 'Digite seu nome.'; render(); return; }
  ST.busy = true; render();
  const room = await loadRoom(code);
  ST.busy = false;
  if(!room){ ST.err.join = 'Sala não encontrada. Confira o código.'; render(); return; }
  if(Object.keys(room.players).length >= room.meta.maxPlayers && !room.players[ST.me.id]){
    ST.err.join = 'Essa sala está cheia.'; render(); return;
  }
  room.players[ST.me.id] = {
    id:ST.me.id, name:j.name.trim(), team:autoAssignTeam(room),
    isHost:false, joinedAt:Date.now(), lastSeen:Date.now(),
  };
  ST.me.name = j.name.trim();
  ST.mode = 'online';
  ST.roomCode = code;
  await saveRoom(code, room);
  ST.room = room;
  ST.screen = room.game && room.game.status==='playing' ? 'round' : (room.game && room.game.status==='ended' ? 'end' : 'lobby');
  startPolling(code);
  render();
}

async function leaveRoom(){
  stopPolling();
  if(ST.mode==='online' && ST.room && ST.roomCode){
    try{
      const r = await loadRoom(ST.roomCode);
      if(r && r.players[ST.me.id]){
        delete r.players[ST.me.id];
        await saveRoom(ST.roomCode, r);
      }
    }catch(e){}
  }
  ST.room = null; ST.localRoom = null; ST.roomCode = null;
  ST.ffaPickerOpen = false; ST.localCoverActive = false;
  ST.screen = 'home';
  render();
}

async function startGame(){
  const room = activeRoom();
  if(!room) return;
  const testDeck = buildDeckIndices(room.meta.contentMode, room.meta.categories, room.meta.difficulties);
  if(!testDeck.length){
    showToast('Nenhuma carta encontrada para essa combinação de categoria/dificuldade.');
    return;
  }
  const minP = room.meta.teamMode==='3teams' ? 3 : 2;
  if(Object.keys(room.players).length < minP){
    showToast('Jogadores insuficientes para começar.');
    return;
  }
  initGame(room);
  if(ST.mode==='local') ST.localCoverActive = true;
  ST.screen = 'round';
  await commitRoom(room);
}

async function playAgain(){
  const room = activeRoom();
  if(!room) return;
  initGame(room);
  if(ST.mode==='local') ST.localCoverActive = true;
  ST.screen = 'round';
  await commitRoom(room);
}

async function backToLobby(){
  const room = activeRoom();
  if(!room) return;
  room.game = null;
  ST.ffaPickerOpen = false; ST.localCoverActive = false;
  ST.screen = 'lobby';
  await commitRoom(room);
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(ST.screen){
    case 'home': html = screenHome(); break;
    case 'create': html = screenCreate(); break;
    case 'join': html = screenJoin(); break;
    case 'lobby': html = screenLobby(); break;
    case 'round': html = screenRound(); break;
    case 'end': html = screenEnd(); break;
    case 'howto': html = screenHowTo(); break;
    default: html = screenHome();
  }
  if(ST.toastMsg) html += `<div class="toast">${esc(ST.toastMsg)}</div>`;
  app.innerHTML = html;
}

  if(len > 9) return 'font-size:clamp(26px,8vw,42px);';
  return '';
}

    <button class="control-btn btn-green" data-action="mark-acertou"><span class="emoji">✅</span>ACERTOU</button>
    <button class="control-btn btn-yellow" data-action="mark-pulou"><span class="emoji">⏭️</span>PULAR</button>
    <button class="control-btn btn-primary btn-proibida" data-action="mark-proibida"><span class="emoji">🚫</span>PALAVRA PROIBIDA / FALOU</button>
  </div>`;
}
function waitingViewHTML(room){
  const cgId = getClueGiverId(room);
  const cg = room.players[cgId];
  return `<div class="waiting-view">
    <div class="waiting-mic">🎙️</div>
    <div class="waiting-title">Vez de ${esc(cg?cg.name:'...')}</div>
    <div class="waiting-sub">Preste atenção nas dicas e grite a resposta em voz alta!</div>
    <div class="scoreboard">${scoreChipsHTML(room)}</div>
  </div>`;
}
function dotOnline(p){ return (ST.mode!=='online' || timeAgoOnline(p.lastSeen)) ? 'online' : ''; }
function desktopLeftPanelHTML(room){
  const g = room.game;
  let out = `<div class="desktop-panel"><h3>JOGADORES</h3>`;
  if(isFfa(g.teamMode)){
    Object.values(room.players).forEach(p=>{
      out += `<div class="player-row"><span class="player-dot ${dotOnline(p)}"></span><span style="flex:1">${esc(p.name)}</span><b>${g.scores[p.id]||0}</b></div>`;
    });
  } else {
    teamsList(g.teamMode).forEach(t=>{
      out += `<div style="margin-bottom:14px;"><div class="team-header"><span class="team-dot" style="background:${TEAM_INFO[t].dot}"></span>${esc(TEAM_INFO[t].label)} — ${g.scores[t]}</div>`;
      playersOfTeam(room.players,t).forEach(p=>{
        out += `<div class="player-row"><span class="player-dot ${dotOnline(p)}"></span>${esc(p.name)}</div>`;
      });
      out += `</div>`;
    });
  }
  out += `</div>`;
  return out;
}
function desktopRightPanelHTML(room){
  const g = room.game;
  let out = `<div class="desktop-panel"><h3>HISTÓRICO</h3><div class="history-mini">`;
  const recent = g.history.slice(-14).reverse();
  if(!recent.length) out += `<p class="field-hint">Nenhuma palavra ainda.</p>`;
  recent.forEach(h=>{
    const icon = h.resultado==='acerto' ? '✅' : (h.resultado==='proibida' ? '🚫' : '⏭️');
    out += `<div class="history-mini-row">${icon} ${esc(h.palavra)}</div>`;
  });
  out += `</div></div>`;
  return out;
}
function actionFlashHTML(){
  if(!ST.actionFlash) return '';
  const t = ST.actionFlash.type;
  const label = t==='acerto' ? '✅ ACERTOU!' : (t==='proibida' ? '🚫 PROIBIDA!' : '⏭️ PULOU');
  const color = t==='acerto' ? 'var(--green)' : (t==='proibida' ? 'var(--red)' : 'var(--yellow)');
  return `<div class="feedback-flash ${t} show"></div><div class="feedback-word show" style="color:${color}">${esc(label)}</div>`;
}
function screenRound(){
  const room = activeRoom();
  if(!room || !room.game) return screenHome();
  const g = room.game;
  if(g.status==='ended') return screenEnd();
  if(ST.mode==='local' && ST.localCoverActive) return coverScreenHTML(room);

  const cgId = getClueGiverId(room);
  const isClueGiver = ST.mode==='local' ? true : (ST.me.id===cgId);
  const card = currentCard(g);
  const voiceBtn = (ST.voiceSupported && isClueGiver) ? `<button class="btn-icon" style="background:${ST.voiceOn?'var(--red)':'var(--ink-soft)'}; border-radius:50%; width:40px; height:40px; flex-shrink:0;" data-action="toggle-voice" title="Detecção por voz (beta)">🎤</button>` : '';

  let stageInner = `<div class="stage-top"><div class="turn-pill">${turnPillText(room,isClueGiver)}</div>`;
  if(!isFfa(g.teamMode)){
    stageInner += `<div class="score-pill">${teamsList(g.teamMode).map(t=>`${t} ${g.scores[t]}`).join(' · ')}</div>`;
  }
  stageInner += voiceBtn;
  stageInner += `</div><div class="stage-main">`;
  if(isClueGiver && card){
    stageInner += tabooCardHTML(card);
    stageInner += roundControlsHTML();
  } else {
    stageInner += waitingViewHTML(room);
  }
  stageInner += `</div>`;

  let out = `<div class="desktop-grid">`;
  out += desktopLeftPanelHTML(room);
  out += `<div class="stage">${stageInner}</div>`;
  out += desktopRightPanelHTML(room);
  out += `</div>`;

  if(ST.ffaPickerOpen && isClueGiver) out += ffaPickerHTML(room);
  out += actionFlashHTML();
  return out;
}
function triggerFlash(type, word){
  ST.actionFlash = { type, word };
  clearTimeout(ST.actionFlashTimer);
  ST.actionFlashTimer = setTimeout(()=>{ ST.actionFlash=null; render(); }, 600);
}

// ============================================================
// TELA FINAL
// ============================================================
function screenEnd(){
  const room = activeRoom();
  if(!room || !room.game) return screenHome();
  const g = room.game;
  const ffa = isFfa(g.teamMode);

  let winnerLabel = '';
  let winnerScore = 0;
  if(ffa){
    const p = room.players[g.winnerKey];
    winnerLabel = p ? p.name : '???';
    winnerScore = g.scores[g.winnerKey]||0;
  } else {
    winnerLabel = TEAM_INFO[g.winnerKey] ? TEAM_INFO[g.winnerKey].label : '???';
    winnerScore = g.scores[g.winnerKey]||0;
  }

  let out = `<div class="app-shell">`;
  out += `<div class="winner-banner">
    <div class="winner-trophy">🏆</div>
    <div class="winner-title">${esc(winnerLabel)} venceu!</div>
    <div class="winner-sub">${winnerScore} pontos</div>
  </div>`;

  out += `<div class="final-scores">`;
  if(ffa){
    const arr = Object.keys(g.scores).map(pid=>({name:room.players[pid]?room.players[pid].name:'?', score:g.scores[pid]}))
      .sort((a,b)=>b.score-a.score);
    arr.forEach(e=>{
      out += `<div class="final-score-card"><div class="n">${e.score}</div><div>${esc(e.name)}</div></div>`;
    });
  } else {
    teamsList(g.teamMode).map(t=>({t,score:g.scores[t]})).sort((a,b)=>b.score-a.score).forEach(e=>{
      const names = playersOfTeam(room.players,e.t).map(p=>p.name).join(', ') || '—';
      out += `<div class="final-score-card" style="border-left:4px solid ${TEAM_INFO[e.t].dot}"><div class="n">${e.score}</div><div>${esc(TEAM_INFO[e.t].label)}</div><div class="field-hint">${esc(names)}</div></div>`;
    });
  }
  out += `</div>`;

  const groups = [
    ['acerto','✅ Acertadas'],
    ['proibida','🚫 Proibidas'],
    ['pulou','⏭️ Puladas'],
  ];
  out += `<div class="word-history">`;
  groups.forEach(([key,label])=>{
    const words = g.history.filter(h=>h.resultado===key);
    out += `<div class="word-history-group"><h3>${esc(label)} (${words.length})</h3><div class="word-tags">`;
    if(!words.length) out += `<span class="field-hint">Nenhuma</span>`;
    words.forEach(w=>{ out += `<span class="word-tag ${key==='acerto'?'acerto':(key==='proibida'?'proibida':'pulou')}">${esc(w.palavra)}</span>`; });
    out += `</div></div>`;
  });
  out += `</div>`;

  out += `<div class="end-actions">
    <button class="btn btn-primary" data-action="play-again">🔄 Jogar novamente</button>
    <button class="btn btn-outline" data-action="back-to-lobby">🏠 Voltar para a sala</button>
  </div>`;
  out += `</div>`;
  return out;
}

// ============================================================
// FORMULÁRIO — chips / campos de texto
// ============================================================
function toggleChip(listName, value){
  const f = ST.form;
  const full = listName==='categories' ? CATEGORIES : DIFFICULTIES;
  const arr = f[listName];
  if(arr.length===0){
    f[listName] = [value];
  } else {
    const i = arr.indexOf(value);
    if(i===-1) arr.push(value); else arr.splice(i,1);
    if(arr.length===full.length) f[listName] = [];
  }
}
const FORM_TEXT_FIELDS = new Set(['roomName','hostName','localPlayerInput','winCustom']);

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    }catch(e2){ return false; }
  }
}

// ============================================================
// EVENTOS
// ============================================================
async function handleAction(action, value, el){
  const f = ST.form;
  switch(action){
    case 'go-home':
      ST.screen = 'home'; ST.err.create=''; ST.err.join=''; render(); break;
    case 'go-create':
      ST.screen = 'create'; render(); break;
    case 'go-join':
      ST.screen = 'join';
      if(typeof location!=='undefined'){
        const m = location.hash.match(/room=([A-Za-z0-9]+)/);
        if(m) ST.join.code = m[1].toUpperCase();
      }
      render(); break;
    case 'go-howto':
      ST.screen = 'howto'; render(); break;
    case 'confirm-leave':
      if(confirm('Sair da sala? Você vai perder sua vaga.')) leaveRoom();
      break;

    // ---- criar sala ----
    case 'set-create-mode':
      f.mode = value; render(); break;
    case 'set-content-mode':
      f.contentMode = value; render(); break;
    case 'add-local-player': {
      const name = (f.localPlayerInput||'').trim();
      if(name){ f.localPlayers.push(name); f.localPlayerInput=''; }
      render(); break;
    }
    case 'remove-local-player':
      f.localPlayers.splice(parseInt(value,10),1); render(); break;
    case 'max-players-inc':
      f.maxPlayers = clampNum(f.maxPlayers+1,2,24); render(); break;
    case 'max-players-dec':
      f.maxPlayers = clampNum(f.maxPlayers-1,2,24); render(); break;
    case 'toggle-all-cat':
      f.categories = []; render(); break;
    case 'toggle-cat':
      toggleChip('categories', value); render(); break;
    case 'toggle-all-diff':
      f.difficulties = []; render(); break;
    case 'toggle-diff':
      toggleChip('difficulties', value); render(); break;
    case 'set-teammode':
      f.teamMode = value; render(); break;
    case 'set-win':
      if(value==='custom'){ f.winCustomMode = true; }
      else { f.winCustomMode = false; f.winCondition = parseInt(value,10); }
      render(); break;
    case 'submit-create':
      await createRoom(); break;

    // ---- entrar em sala ----
    case 'submit-join':
      await joinRoom(); break;

    // ---- lobby ----
    case 'copy-link': {
      const ok = await copyText(value);
      showToast(ok ? 'Link copiado!' : 'Não foi possível copiar.');
      break;
    }
    case 'share-link': {
      if(navigator.share){
        try{ await navigator.share({ title:'Não Pode', text:'Bora jogar Não Pode! 🎮', url:value }); }
        catch(e){ /* usuário cancelou */ }
      } else {
        const ok = await copyText(value);
        showToast(ok ? 'Link copiado!' : 'Não foi possível compartilhar.');
      }
      break;
    }
    case 'cycle-team': {
      const room = activeRoom(); if(!room) break;
      cycleTeamFor(room, value);
      await commitRoom(room);
      break;
    }
    case 'shuffle-teams': {
      const room = activeRoom(); if(!room) break;
      shuffleTeams(room);
      await commitRoom(room);
      break;
    }
    case 'start-game':
      await startGame(); break;

    // ---- rodada ----
    case 'reveal-card':
      ST.localCoverActive = false; render(); break;
    case 'mark-acertou': {
      const room = activeRoom(); if(!room || !room.game) break;
      if(isFfa(room.game.teamMode)){ ST.ffaPickerOpen = true; render(); break; }
      const word = currentCard(room.game).palavra;
      actionAcertou(room);
      triggerFlash('acerto', word);
      await commitRoom(room);
      break;
    }
    case 'mark-pulou': {
      const room = activeRoom(); if(!room || !room.game) break;
      const word = currentCard(room.game).palavra;
      actionPulou(room);
      triggerFlash('pulou', word);
      await commitRoom(room);
      break;
    }
    case 'mark-proibida': {
      const room = activeRoom(); if(!room || !room.game) break;
      const word = currentCard(room.game).palavra;
      actionProibida(room);
      triggerFlash('proibida', word);
      await commitRoom(room);
      break;
    }
    case 'close-ffa-picker':
      ST.ffaPickerOpen = false; render(); break;
    case 'ffa-pick': {
      const room = activeRoom(); if(!room || !room.game) break;
      const word = currentCard(room.game).palavra;
      actionAcertou(room, value);
      ST.ffaPickerOpen = false;
      triggerFlash('acerto', word);
      await commitRoom(room);
      break;
    }
    case 'toggle-voice':
      toggleVoiceRecognition(); break;

    // ---- final ----
    case 'play-again':
      await playAgain(); break;
    case 'back-to-lobby':
      await backToLobby(); break;

    case 'noop': break;
  }
}

function wireEvents(){
  const app = document.getElementById('app');
  app.addEventListener('click', (e)=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    if(t.getAttribute('data-action')==='noop' && e.target!==t) return;
    if(e.target.closest('.modal-sheet') && t.classList.contains('modal-backdrop')) return;
    e.preventDefault();
    handleAction(t.getAttribute('data-action'), t.getAttribute('data-value'), t);
  });
  app.addEventListener('input', (e)=>{
    const field = e.target.getAttribute && e.target.getAttribute('data-field');
    if(!field) return;
    if(field==='joinCode'){ ST.join.code = e.target.value.toUpperCase(); return; }
    if(field==='joinName'){ ST.join.name = e.target.value; return; }
    if(field==='maxPlayers'){ ST.form.maxPlayers = clampNum(parseInt(e.target.value,10)||2,2,24); return; }
    if(FORM_TEXT_FIELDS.has(field)){ ST.form[field] = e.target.value; return; }
  });
  app.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && e.target && e.target.getAttribute && e.target.getAttribute('data-field')==='localPlayerInput'){
      e.preventDefault();
      handleAction('add-local-player', null, e.target);
    }
  });
}

// ============================================================
// DETECÇÃO POR VOZ (beta, opcional — nunca obrigatória)
// ============================================================
function wordVariants(norm){
  const variants = new Set([norm]);
  if(norm.length>3){
    if(norm.endsWith('s')) variants.add(norm.slice(0,-1)); else variants.add(norm+'s');
    if(norm.endsWith('o')) variants.add(norm.slice(0,-1)+'a');
    if(norm.endsWith('a')) variants.add(norm.slice(0,-1)+'o');
    if(norm.endsWith('os')) variants.add(norm.slice(0,-2)+'a');
    if(norm.endsWith('as')) variants.add(norm.slice(0,-2)+'o');
  }
  return variants;
}
function checkVoiceAgainstForbidden(transcript){
  const room = activeRoom();
  if(!room || !room.game) return;
  const card = currentCard(room.game);
  if(!card) return;
  const cgId = getClueGiverId(room);
  const isClueGiver = ST.mode==='local' ? true : (ST.me.id===cgId);
  if(!isClueGiver) return;
  const heardWords = normalizeWord(transcript).split(/[^a-z0-9]+/i).filter(Boolean);
  const heardSet = new Set();
  heardWords.forEach(w=>{ wordVariants(w).forEach(v=>heardSet.add(v)); });
  const allForbidden = card.proibidas.concat([card.palavra]);
  for(let k=0;k<allForbidden.length;k++){
    const fw = allForbidden[k];
    const fwParts = normalizeWord(fw).split(/\s+/).filter(Boolean);
    let matched;
    if(fwParts.length>1){
      matched = fwParts.every(part=>{
        let found=false;
        wordVariants(part).forEach(pv=>{ if(heardSet.has(pv)) found=true; });
        return found;
      });
    } else {
      matched = false;
      wordVariants(fwParts[0]||'').forEach(v=>{ if(heardSet.has(v)) matched=true; });
    }
    if(matched){
      ST.voiceFlash = fw;
      render();
      clearTimeout(ST.voiceFlashTimer);
      ST.voiceFlashTimer = setTimeout(()=>{ ST.voiceFlash=null; render(); }, 2200);
      break;
    }
  }
}
function toggleVoiceRecognition(){
  if(!ST.voiceSupported) return;
  if(ST.voiceOn){
    if(ST.voiceRec){ try{ ST.voiceRec.stop(); }catch(e){} }
    ST.voiceOn = false;
    render();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec;
  try{ rec = new SR(); }catch(e){ return; }
  rec.lang = 'pt-BR';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (ev)=>{
    let transcript = '';
    for(let i=ev.resultIndex;i<ev.results.length;i++) transcript += ' ' + ev.results[i][0].transcript;
    checkVoiceAgainstForbidden(transcript);
  };
  rec.onerror = ()=>{};
  rec.onend = ()=>{ if(ST.voiceOn){ try{ rec.start(); }catch(e){} } };
  try{
    rec.start();
    ST.voiceRec = rec;
    ST.voiceOn = true;
  }catch(e){ ST.voiceOn = false; }
  render();
}

// ============================================================
// INICIALIZAÇÃO
// ============================================================
function init(){
  resetFormDefaults();
  if(typeof location!=='undefined' && location.hash){
    const m = location.hash.match(/room=([A-Za-z0-9]+)/i);
    if(m){
      ST.join.code = m[1].toUpperCase();
      ST.screen = 'join';
    }
  }
  wireEvents();
  render();
}
init();
